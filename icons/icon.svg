<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mindpassGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="5" y="5" width="118" height="118" rx="28" fill="url(#mindpassGrad)" filter="url(#glow)"/>
  
  <!-- Subtle Rim Highlight -->
  <rect x="5.5" y="5.5" width="117" height="117" rx="27.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Neural Keyhead Loop -->
  <circle cx="64" cy="48" r="22" stroke="#FFFFFF" stroke-width="9" fill="none"/>
  
  <!-- Neural Cyan Center Node -->
  <circle cx="64" cy="48" r="6" fill="#38BDF8"/>

  <!-- Precision Key Shaft -->
  <path d="M64 65V102" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>

  <!-- Key Teeth -->
  <path d="M64 88H80" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <path d="M64 98H76" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
</svg>
